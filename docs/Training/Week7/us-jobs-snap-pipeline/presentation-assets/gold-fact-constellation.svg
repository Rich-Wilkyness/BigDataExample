<text x="1065" y="582" dominant-baseline="text-before-edge" text-anchor="start" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#24344B">fact_state_industry_month</text>
<text x="1065" y="628" dominant-baseline="text-before-edge" text-anchor="start" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#7B662A">Grain: one state + industry + calendar month</text>
<text x="1065" y="682" dominant-baseline="text-before-edge" text-anchor="start" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#24344B">state_key  [FK]    date_key  [FK]</text>
<text x="1065" y="726" dominant-baseline="text-before-edge" text-anchor="start" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#24344B">industry_key  [FK]</text>
<text x="1065" y="770" dominant-baseline="text-before-edge" text-anchor="start" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#24344B">industry_nonfarm_jobs</text>
<text x="1065" y="875" dominant-baseline="text-before-edge" text-anchor="start" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#56677D">Plus source status, lineage, and revision metadata</text>
<text x="80" y="955" dominant-baseline="text-before-edge" text-anchor="start" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#24344B">Each dimension can label many fact rows. Lines show logical key relationships, not enforced constraints.</text>
<text x="80" y="999" dominant-baseline="text-before-edge" text-anchor="start" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#24344B">Keep SNAP in the state/month fact: joining to several industries must not multiply SNAP totals.</text>
</svg>