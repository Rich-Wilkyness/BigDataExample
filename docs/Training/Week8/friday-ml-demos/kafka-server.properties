# One local JVM performs both roles: broker stores topic records; controller
# manages cluster metadata through Kafka's built-in Raft quorum (KRaft).
# This one-node configuration is a learning environment with no fault tolerance.
process.roles=broker,controller
node.id=1

# Clients connect to 9092; the controller endpoint is separate on 9093.
# Bind both listeners to loopback so this demo is local to this machine.
listeners=PLAINTEXT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093
advertised.listeners=PLAINTEXT://localhost:9092
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
inter.broker.listener.name=PLAINTEXT
controller.listener.names=CONTROLLER
controller.quorum.bootstrap.servers=127.0.0.1:9093

# Keep this lab's storage separate from any other Kafka installation's data.
# Relative paths resolve from the process working directory: start/format from
# friday-ml-demos every time. Formatting initializes this storage only once.
log.dirs=./kafka-data

# This lab has one broker, so internal topics and transaction state use one copy.
# These factors enable local operation; they do not provide replicated recovery.
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
num.partitions=1
group.initial.rebalance.delay.ms=0
