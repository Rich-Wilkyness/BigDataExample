name: big-data-example

services:
  postgres:
    image: postgres:18.6
    container_name: big-data-example-postgres
    restart: unless-stopped
    shm_size: 128mb
    env_file:
      - .env
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

volumes:
  postgres-data:
    name: big-data-example-postgres-data
