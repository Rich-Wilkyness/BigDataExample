[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "big-data-example"
version = "0.1.0"
description = "A Python and SQL curriculum for big-data engineering"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Private educational project" }
authors = [{ name = "BigDataExample contributors" }]
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
